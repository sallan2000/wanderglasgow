version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /artifacts/*
      - /lib/*
      - /scripts
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name
      vite-toolchain-major:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - "@tailwindcss/vite"
          - tailwindcss
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
