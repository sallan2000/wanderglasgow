name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
        # Report vulnerabilities without failing the build.
        # Critical issues should still be addressed, but high-severity
        # findings in transitive dependencies of the broader workspace
        # (connectors-sdk, drizzle, express, etc.) should not block CI.
        continue-on-error: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Local tests
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        script:
          - test:planner
          - test:admin
          - test:email
          - test:access
          - test:walks
          - test:starting-areas
          - test:itinerary
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/glasgow-walks run ${{ matrix.script }}

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke-test the Vite development server
        shell: bash
        run: |
          set -euo pipefail
          setsid env PORT=4173 BASE_PATH=/ pnpm --filter @workspace/glasgow-walks run dev > /tmp/glasgow-vite.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:4173/src/main.tsx >/dev/null
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/glasgow-vite.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/glasgow-vite.log
          echo "Vite did not become ready within 30 seconds" >&2
          exit 1
      - run: pnpm --filter @workspace/glasgow-walks exec playwright install chromium
      - run: pnpm --filter @workspace/glasgow-walks run test:planner
      - run: pnpm --filter @workspace/glasgow-walks run test:walks
      - run: pnpm --filter @workspace/glasgow-walks run test:itinerary:browser
      - run: pnpm --filter @workspace/glasgow-walks run test:access:browser
      - run: pnpm --filter @workspace/glasgow-walks run test:starting-areas:browser
      - run: pnpm --filter @workspace/glasgow-walks run test:email:browser
