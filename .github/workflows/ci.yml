name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
        # Report vulnerabilities without failing the build.
        # Critical issues should still be addressed, but high-severity
        # findings in transitive dependencies of the broader workspace
        # (connectors-sdk, drizzle, express, etc.) should not block CI.
        continue-on-error: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Local tests
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        script:
          - test:planner
          - test:admin
          - test:email
          - test:access
          - test:walks
          - test:starting-areas
          - test:itinerary
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/glasgow-walks run ${{ matrix.script }}

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/glasgow-walks exec playwright install chromium
      - run: pnpm --filter @workspace/glasgow-walks run test:planner
      - run: pnpm --filter @workspace/glasgow-walks run test:walks
      - run: pnpm --filter @workspace/glasgow-walks run test:itinerary:browser
      - run: pnpm --filter @workspace/glasgow-walks run test:access:browser
      - run: pnpm --filter @workspace/glasgow-walks run test:starting-areas:browser
      - run: pnpm --filter @workspace/glasgow-walks run test:email:browser
