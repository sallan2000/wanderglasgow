kind = "web"
previewPath = "/"
title = "Wander Glasgow"
description = "A mobile-first Glasgow walking-tour website with curated themed routes, GPS-based starting points, and open mapping directions for visitors exploring the city on foot."
version = "1.0.0"
id = "artifacts/glasgow-walks"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25673

[services.development]
run = "pnpm --filter @workspace/glasgow-walks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glasgow-walks", "run", "build" ]
serve = "static"
publicDir = "artifacts/glasgow-walks/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25673"
BASE_PATH = "/"
